[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "email-outreach"
version = "0.1.0"
description = "Active recommendation and contextual bandit experiments for email outreach dynamics"
readme = "README.md"
requires-python = ">=3.12"

dependencies = [
	"torch",
	"torchmetrics",
	"numpy",
	"pandas",
	"scikit-learn",
	"scipy",
	"joblib",
	"psycopg",
	"matplotlib",
	"implicit",
	"pyarrow",
]

[project.optional-dependencies]
dev = [
    "pylint",
    "black",
    "mypy",
    "isort",
]

[project.scripts]
grid-search = "email_outreach.cli_grid_search:main"
test-any-model = "email_outreach.cli_test:main"

[tool.setuptools.packages.find]
where = ["src"]
